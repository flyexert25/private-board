<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Task Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Local workspace</p>
        <h1>Локальная доска задач</h1>
        <p class="hero-copy">
          Удобная Trello-подобная доска для личных задач, планирования и отслеживания прогресса.
          Все изменения сохраняются прямо в браузере.
        </p>
      </div>
      <button class="ghost-button" id="reset-board" type="button">Сбросить доску</button>
    </header>

    <main>
      <section id="status-banner" class="status-banner hidden"></section>

      <section class="toolbar">
        <div class="toolbar-copy">
          <h2 id="board-title">Моя доска</h2>
          <p id="board-meta">Загружаем колонки...</p>
        </div>
        <form id="column-form" class="column-form">
          <input
            id="column-title"
            name="title"
            type="text"
            maxlength="40"
            placeholder="Новая колонка"
            aria-label="Название новой колонки"
            required
          >
          <button type="submit">Добавить колонку</button>
        </form>
      </section>

      <section id="board" class="board" aria-label="Доска задач"></section>
    </main>
  </div>

  <template id="card-template">
    <article class="card" draggable="true">
      <div class="card-content">
        <h3 class="card-title"></h3>
        <p class="card-description"></p>
      </div>
      <button class="icon-button delete-card" type="button" aria-label="Удалить карточку">×</button>
    </article>
  </template>

  <template id="column-template">
    <section class="column">
      <header class="column-header">
        <div>
          <h2 class="column-title"></h2>
          <p class="column-count"></p>
        </div>
        <button class="icon-button delete-column" type="button" aria-label="Удалить колонку">×</button>
      </header>

      <div class="cards" aria-label="Карточки колонки"></div>

      <form class="card-form">
        <input
          class="card-title-input"
          name="title"
          type="text"
          maxlength="60"
          placeholder="Название карточки"
          required
        >
        <textarea
          class="card-description-input"
          name="description"
          rows="3"
          maxlength="160"
          placeholder="Описание"
        ></textarea>
        <button type="submit">Добавить карточку</button>
      </form>
    </section>
  </template>

  <script src="./app.js"></script>
</body>
</html>
